# ASCENT continuous checks - Python goldens + JS lock
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e ".[deep-space]"
      - name: Codec goldens
        env:
          PYTHONPATH: ref
        run: python tests/test_ascent_codec.py
      - name: SkyPulse PATHHINT goldens
        env:
          PYTHONPATH: ref
        run: python tests/test_skypulse.py
      - name: CLI self-test
        run: python -m ascent self-test

  js-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS/Python packing lock
        run: node tests/run_js_lock.js
