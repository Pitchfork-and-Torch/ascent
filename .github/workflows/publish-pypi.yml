# Publish ascent-wire to PyPI via Trusted Publishing (OIDC).
# Requires PyPI project "ascent-wire" Trusted Publisher:
#   Owner: Pitchfork-and-Torch
#   Repo: ascent
#   Workflow: publish-pypi.yml
#   Environment: pypi  (optional but recommended)
name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ascent-wire/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-runs and workflow_dispatch stay green when version already on PyPI.
          # Trusted Publisher OIDC must still succeed (verified 2026-08-01).
          skip-existing: true
          verbose: true
